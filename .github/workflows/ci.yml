name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: models
          key: model-mobilenetv2-12-${{ hashFiles('scripts/download_model.py') }}

      - name: Download & verify model
        run: python scripts/download_model.py

      - name: Run tests
        run: pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t snaplabel:ci .

      - name: Smoke test container
        run: |
          docker run -d --name app -p 8000:8000 snaplabel:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep '"loaded":true'
          docker logs app
          docker rm -f app
