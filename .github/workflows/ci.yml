name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: snaplabel

jobs:
  # 1) 테스트: 버전 고정된 의존성 설치 + 모델 다운로드/검증 + pytest
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: models
          key: model-mobilenetv2-12-${{ hashFiles('scripts/download_model.py') }}

      - name: Download & verify model (SHA256)
        run: python scripts/download_model.py

      - name: Verify model loads and runs
        run: python scripts/verify_model.py

      - name: Run tests
        run: pytest -v

  # 2) Docker 이미지 빌드 → 컨테이너 스모크 테스트 → Docker Hub 푸시
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      # 빌드 중 scripts/verify_model.py 가 실패하면 여기서 빌드가 중단됨
      - name: Build image (load for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name app -p 8000:8000 ${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep '"loaded":true'
          curl -fsS -F "file=@screenshots/1_preview.png;type=image/png" \
            http://127.0.0.1:8000/api/predict | grep '"predictions"'
          docker logs app
          docker rm -f app

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 로컬(Apple Silicon Mac) 배포를 위해 amd64 + arm64 이미지를 함께 빌드
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'

      - name: Build & push to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha

  # 3) CD: 내 컴퓨터(self-hosted runner)에서 새 이미지를 받아 무중단(Blue-Green) 교체
  deploy:
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    concurrency:
      group: local-deploy
      cancel-in-progress: false
    env:
      DEPLOY_PORT: "8080"
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull & replace app container (zero-downtime check)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE="$DOCKERHUB_USERNAME/${IMAGE_NAME}:sha-$SHORT_SHA"
          bash deploy/verify_zero_downtime.sh "$IMAGE" "$SHORT_SHA"
